<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>transit-alert</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">
<meta name="color-scheme" content="light dark">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css" rel="stylesheet" />
<script>
(function () {
  var pref = localStorage.getItem('themePref') || 'auto';
  var dark = pref === 'night' ||
    (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/planner.css">
<link rel="stylesheet" href="css/stops.css">
<link rel="stylesheet" href="css/reports.css">
<link rel="stylesheet" href="css/compatibility.css">
</head>
<body>
<div id="backend-connection-status" role="status" aria-live="polite" hidden>Brak połączenia z serwerem. Trwa ponawianie połączenia…</div>

<div id="map"></div>

<button id="fab-report"><div class="svg-icon icon-megaphone"></div> Kanar obok!</button>

<div id="overlay"></div>

<!-- Стрічка дописів -->
<div id="reports-drawer">
  <div id="drawer-handle"></div>
  <div id="drawer-header">
    <h2>Zgłoszenia</h2>
    <div class="drawer-actions">
      <button id="drawer-add">+</button>
      <button id="drawer-close">✕</button>
    </div>
  </div>
  <div id="drawer-list"></div>
</div>

<!-- СТАРА ВЕЛИКА ФОРМА (Вона необхідна для "Wpisz ręcznie") -->
<div id="report-modal">
  <div id="modal-header">
    <h2>Zgłoś kanara</h2>
    <button id="modal-close">✕</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-linia">Linia</button>
    <button class="tab-btn" id="tab-btn-przystanek">Przystanek</button>
  </div>

  <div class="form-body">
    <div class="form-tab active" id="tab-linia">
      <div class="field">
        <label>Numer linii</label>
        <input id="route-input" type="text" inputmode="numeric" placeholder="np. 14" autocomplete="off">
        <div class="autocomplete-list" id="route-suggestions"></div>
      </div>
      <div class="field">
        <label>Przystanek</label>
        <input id="stop-name-input" type="text" placeholder="np. Plac Litewski" autocomplete="off">
        <div class="autocomplete-list" id="stop-name-suggestions"></div>
      </div>
      <div class="field">
        <label>Kierunek</label>
        <select id="direction-select" disabled>
          <option value="">— спершу оберіть лінію —</option>
        </select>
      </div>
    </div>

    <div class="form-tab" id="tab-przystanek">
      <div class="field">
        <label>Przystanek (z platformą)</label>
        <input id="stop-id-input" type="text" placeholder="np. Plac Litewski 01" autocomplete="off">
        <div class="autocomplete-list" id="stop-id-suggestions"></div>
      </div>
    </div>

    <div class="field">
      <label>Komentarz (opcjonalnie)</label>
      <textarea id="comment-input" placeholder="np. 2 kontrolerów w cywilnym"></textarea>
    </div>

    <button id="submit-btn">Zgłoś</button>
    <div id="form-hint"></div>
  </div>
</div>

<!-- НОВА ШВИДКА ПАНЕЛЬ -->
<div id="quick-report-modal">
  <div id="drawer-handle"></div>
  <div class="quick-header">
    <h2>Zgłoś kanarów</h2>
    <p>Wybierz cel w pobliżu</p>
  </div>

  <div class="quick-options" id="quick-options-list">
    <!-- За замовчуванням обрано перший варіант -->
    <button class="quick-option selected" data-report-value="Linia 14">
      <div class="svg-icon icon-bus"></div> Linia 14 (w pobliżu)
    </button>
    <button class="quick-option" data-report-value="Lotnicza 01">
      <div class="svg-icon icon-bus-stop"></div> Lotnicza 01 (30m)
    </button>
    <button class="quick-option" data-report-value="Obecna lokalizacja">
      <div class="svg-icon icon-map-pin"></div> Obecna lokalizacja
    </button>
  </div>

  <div class="quick-actions">
    <button class="quick-action-btn btn-cancel">Anuluj</button>
    <button class="quick-action-btn btn-confirm" id="quick-confirm-btn">Potwierdzam</button>
  </div>

  <div class="manual-link-wrap">
    <a href="#" class="manual-link">Wpisz ręcznie (inna lokalizacja)</a>
  </div>
</div><!-- --- Екран "Przystanek" (Розклад) --- -->
<div id="screen-stop" class="screen-container" style="display: none;">
  <div class="stop-search-header">
      <input type="text" id="stop-screen-search" placeholder="Wprowadź nazwę przystanku..." autocomplete="off">


    <div id="stop-screen-suggestions" class="autocomplete-list"></div>
  </div>

  <div id="stop-title-container" style="display: none;">
    <h2 id="stop-name-display"></h2>
  </div>

  <div id="departures-list">
    <!-- Сюди JS малюватиме картки рейсів -->
    <div id="departures-empty" style="text-align: center; color: var(--text-muted); margin-top: 40px;">
      Wybierz przystanek, aby zobaczyć odjazdy.
    </div>
  </div>
</div>


<!-- --- Екран "Trasa" (Планувальник A-to-B) --- -->
<div id="screen-route" class="screen-container" style="display: none;">
  <div class="stop-search-header" style="display: flex; flex-direction: column; gap: 6px;">

    <!-- Поле "Звідки" -->
<div style="position: relative;">
  <span id="route-selected-icon-from" class="route-selection-icon" aria-hidden="true" hidden></span>
  <input type="text" id="route-input-from"
    style="width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 9px; padding: 9px 36px 9px 40px; font-size: 15px; background: var(--bg); color: var(--text);"
    placeholder="Skąd..." autocomplete="off">

  <button id="route-clear-from" type="button" class="route-action-btn icon-location" title="Użyj mojej lokalizacji"></button>
  <div id="route-suggestions-from" class="autocomplete-list"></div>
</div>

<!-- Поле "Куди" -->
<div style="position: relative;">
  <span id="route-selected-icon-to" class="route-selection-icon" aria-hidden="true" hidden></span>
  <input type="text" id="route-input-to"
    style="width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 9px; padding: 9px 36px 9px 40px; font-size: 15px; background: var(--bg); color: var(--text);"
    placeholder="Dokąd..." autocomplete="off">

  <button id="route-clear-to" type="button" class="route-action-btn icon-location" title="Użyj mojej lokalizacji"></button>
  <div id="route-suggestions-to" class="autocomplete-list"></div>
</div>

    <button id="route-search-btn"
      style="width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 9px; padding: 10px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 2px;">
      Szukaj połączenia
    </button>

</div>
<!-- Контейнер для останніх маршрутів (буде показуватися до пошуку) -->
<div id="recent-routes-list" style="margin-top: 15px;"></div>

<!-- Твій існуючий контейнер для результатів -->
  <div class="trasa-presentation-switch" role="group" aria-label="Wygląd kart połączeń">
    <button id="trasa-presentation-classic" type="button" aria-pressed="true">Klasyczna</button>
    <button id="trasa-presentation-new" type="button" aria-pressed="false">Nowa · eksperyment</button>
  </div>
  <div id="route-results-list" style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="text-align: center; color: var(--text-muted); margin-top: 40px;">
      Wybierz przystanek początkowy i końcowy.
    </div>
  </div>
</div>

<!-- Нижня навігація -->
<div id="bottom-nav">
  <button class="nav-item active" id="nav-map">
    <div class="nav-icon" style="-webkit-mask-image: url('map.svg'); mask-image: url('map.svg');"></div>
    Mapa
  </button>
  <button class="nav-item" id="nav-route">
    <div class="nav-icon" style="-webkit-mask-image: url('route.svg'); mask-image: url('route.svg');"></div>
    Trasa
  </button>
  <button class="nav-item" id="nav-stop">
    <div class="nav-icon" style="-webkit-mask-image: url('stop.svg'); mask-image: url('stop.svg');"></div>
    Przystanek
  </button>
  <button class="nav-item" id="nav-reports">
    <div class="nav-icon" style="-webkit-mask-image: url('reports.svg'); mask-image: url('reports.svg');"></div>
    Zgłoszenia
  </button>
</div>
<!-- Модальне вікно для стеження за одним автобусом -->
<div id="vehicle-modal" class="modal-overlay">
    <div class="modal-content">
        <button id="close-modal-btn" class="close-btn">&times;</button>
        <h3 id="modal-route-title" style="margin-top:0; text-align:center;"></h3>
        <!-- Контейнер для нашої другої карти -->
     <div id="modal-map"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
